# Built-in ACP session-update rendering templates.
#
# Each top-level key is a sessionUpdate discriminator (the 'kind' produced
# by acpNotificationKind); each value is a template4d template rendered
# against the RAW, unmodified ACP notification object — see default.yaml's
# header comment for the field/function reference this and every other
# built-in file shares.
#
# Mirrors the Claude Code CLI's own visual conventions: a bullet (⏺) marks
# each tool call, its result is indented under an elbow (⎿), and
# tool_call_update reuses the same bullet/elbow pairing so a call and its
# outcome read as one connected block instead of two disjoint lines.
agent_message_chunk: "{{contentText .update.content}}"

user_message_chunk: "> {{contentText .update.content}}"

agent_thought_chunk: |-
  {{if contentText .update.content}}

  _{{contentText .update.content}}_{{end}}

tool_call: |-
  {{$content := toolCallContentJoined .update.content}}

  ⏺ **{{.update.title}}**
  {{if .update.rawInput}}
    {{switch .update.title -}}
    {{case "Read"}} `{{.update.rawInput.file_path}}`
    {{case "Write", "Edit"}}
    {{case "Bash"}} `{{.update.rawInput.command}}`
    {{case "Agent"}} {{.update.rawInput.description}} {{if .update.rawInput.run_in_background}}(**Background**){{end}}**

  ```
  {{.update.rawInput.prompt}}
  ```
    {{default }}

  ```json
  {{prettyJson .}}
  ```
    {{end -}}
  {{else if $content}}

  {{"  "}}⎿  {{$content}}
  {{end}}

tool_call_update: |-
  {{$content := toolCallContentJoined .update.content -}}
  {{$label := label .update.title .update.toolCallId -}}
  {{switch .update.status}}{{case "completed"}}

    ⎿  {{$label}} done{{case "failed"}}

    ⎿  {{$label}} failed{{default}}

    ⎿  {{$label}}…{{end}}{{if $content}}
    {{$content}}{{end}}

plan: |-
  {{if .update.entries}}

  **Plan**{{range .update.entries}}
    ☐ {{.content}} _({{.status}})_{{end}}{{end}}

usage_update: |+
  
  {{metaTokens .update._meta "input"}} tokens in · {{metaTokens .update._meta "output"}} out | cache +{{metaTokens .update._meta "cacheNew"}} new · {{metaTokens .update._meta "cacheRead"}} hit | {{humanTokens .update.used}}/{{humanTokens .update.size}} ctx{{if .update.size}} ({{pct .update.used .update.size}}%){{end}}
  

current_mode_update: |-


  Mode: **{{.update.currentModeId}}**

available_commands_update: |-


  {{len .update.availableCommands}} command(s) available

permission_request: |-
  
  
  ⏺ **Permission requested**{{if .toolCall.title}}: {{.toolCall.title}}{{end}}
  {{switch .toolCall.title -}}
    {{case "Bash"}} `{{.toolCall.rawInput.command}}`
    {{case "Read"}} `{{.toolCall.rawInput.file_path}}`
    {{case "Edit" -}}
      {{if .toolCall.rawInput.path}}`{{.toolCall.rawInput.path}}`
  
  ```
  {{diff .toolCall.rawInput.oldText .toolCall.rawInput.newText}}
  ```
  
      {{end}}
    {{case "Write"}} `{{.toolCall.rawInput.file_path}}`

  ```
  {{.toolCall.rawInput.content}}
  ```

    {{case "Script"}} `{{.toolCall.rawInput.script}}`
    {{case "AskUserQuestion"}} {{.toolCall.rawInput.question}}
    {{default -}}

  ```json
  {{prettyJson .}}
  ```

  {{end -}}
  {{if .options}}

  Options:
    {{switch .toolCall.title -}}
    {{case "AskUserQuestion"}}
      {{range $i, $o := .options }}
    
    {{add $i 1}}. {{if $o.name}}{{$o.name}}{{else}}{{$o.optionId}}{{end}}
      {{end}}
    {{default -}}
    {{range $i, $o := .options -}}{{add $i 1}}. {{if $o.name}}{{$o.name}}{{else}}{{$o.optionId}}{{end}} {{end}}
    {{end -}}
  {{end}}
# Deliberately no 'unknown' key: AcpRenderEngine's fallback chain
# (extractable text, then a raw JSON dump) only kicks in when a kind is NOT
# a key in this map. Mapping 'unknown' to "" here would silently swallow
# every malformed notification instead of showing the raw-JSON fallback —
# the opposite of the "messages are always displayed" guarantee this
# engine provides.
