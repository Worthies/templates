# Built-in ACP session-update rendering templates.
#
# Each top-level key is a sessionUpdate discriminator (the 'kind' produced
# by acpNotificationKind); each value is a template4d template rendered
# against the RAW, unmodified ACP notification object — {{.sessionId}},
# {{.update.<field>}} for ordinary notifications, or {{.toolCall}}/
# {{.options}} directly for permission_request (see
# lib/render/acp_message_view.dart for why nothing is flattened).
#
# Formatting a template genuinely cannot do itself (icon lookups, JSON
# pretty-printing, human-readable token counts, ToolCallContent text
# extraction) is exposed as a custom function — see
# lib/render/acp_template_functions.dart for the full list (contentText,
# toolCallText, toolCallContentJoined, toolIcon, planIcon, diff,
# rawOutputText, prettyJson, humanTokens, pct, metaTokens, label).
#
# This default reproduces the legacy Go FormatACPUpdate text format
# (agents/session/acp_client.go) so agents without a bespoke template keep
# their historical rendering. plan_update/plan_removed/config_option_update/
# session_info_update have no Go-side legacy formatting (FormatACPUpdate
# doesn't handle them either), so these use the same bracketed wording
# convention as the rest of this file.
#
# NOTE on the literal block scalars (|-) below: unlike Mustache, template4d
# does not strip any newline for you — a blank line in the source is a
# blank line in the output. Every leading blank line you see below is
# intentional (it reproduces a leading "\n" that used to be spelled out in
# a quoted string); where {{end}} needs to NOT emit a preceding newline, it
# sits directly after the previous tag on the same line rather than on its
# own.
agent_message_chunk: "{{contentText .update.content}}"

user_message_chunk: "[User] {{contentText .update.content}}"

agent_thought_chunk: |-

  >{{contentText .update.content}}

tool_call: |-
  {{$content := toolCallContentJoined .update.content}}

  [Tool: **{{.update.title}}**]
  {{if $content}}

  {{$content}}
  {{else if .update.rawInput}}

  {{prettyJson .update.rawInput}}
  {{end}}

tool_call_update: "{{if .update.content}}{{toolCallContentJoined .update.content}}{{else}}{{rawOutputText .update.rawOutput}}{{end}}"

plan: |-
  {{if .update.entries}}

  [Plan]{{range $i, $e := .update.entries}}
    {{add $i 1}}. {{$e.content}}({{$e.status}}){{end}}{{end}}

plan_update: |-
  {{if .update.plan.entries}}

  [Plan updated]{{range $i, $e := .update.plan.entries}}
    {{add $i 1}}. {{$e.content}}({{$e.status}}){{end}}{{end -}}
  {{if .update.plan.content}}

  [Plan]

  {{.update.plan.content}}{{end -}}
  {{if .update.plan.uri}}

  [Plan] {{.update.plan.uri}}{{end}}

plan_removed: |-
  {{if .update.id}}
  [Plan removed] {{.update.id}}{{end}}

available_commands_update: |-


  [Commands updated] {{len .update.availableCommands}} available

config_option_update: |-
  {{if .update.configOptions}}
  [Config updated]{{range .update.configOptions}}
    {{.name}} = {{.currentValue}}{{if .description}} ({{.description}}){{end}}{{end}}{{end}}

session_info_update: |-
  {{if .update.title}}
  [Session] {{.update.title}}{{end}}{{if .update.updatedAt}}
  [Updated] {{.update.updatedAt}}{{end}}

usage_update: |-


  📊 Tokens: {{metaTokens .update._meta "input"}} ↘️ · {{metaTokens .update._meta "output"}} ↗️ | cache +{{metaTokens .update._meta "cacheNew"}} new · {{metaTokens .update._meta "cacheRead"}} hit | {{humanTokens .update.used}}/{{humanTokens .update.size}} ctx

current_mode_update: |-


  [Mode: {{.update.currentModeId}}]

permission_request: |-



  [Permission requested]{{if .toolCall.title}} {{.toolCall.title}}{{end}}{{if .toolCall.rawInput}}

  {{prettyJson .toolCall.rawInput}}
  {{end}}{{if .options}}

  Options:{{range $i, $o := .options}}
    {{add $i 1}}. {{if $o.name}}{{$o.name}}{{else}}{{$o.optionId}}{{end}}{{end}}{{end}}
# Deliberately no 'unknown' key: AcpRenderEngine's fallback chain
# (extractable text, then a raw JSON dump) only kicks in when a kind is NOT
# a key in this map. Mapping 'unknown' to "" here would silently swallow
# every malformed notification instead of showing the raw-JSON fallback —
# the opposite of the "messages are always displayed" guarantee this
# engine provides.
