# Built-in ACP session-update rendering templates.
#
# Each top-level key is a sessionUpdate discriminator (the 'kind' produced
# by acpNotificationKind); each value is a template4d template rendered
# against the RAW, unmodified ACP notification object — see default.yaml's
# header comment for the field/function reference this and every other
# built-in file shares.
#
# Mirrors drift's own native terminal chat renderer
# (drift/crates/drift/src/chat_render.rs): the same icon/wording
# conventions (💭 thinking, ✅/❌/⏳ tool status, 📊 usage), just emitted as
# Markdown instead of ANSI color codes. Tool calls additionally carry a
# kind icon (📖 read, ✏️ edit, ⚡ execute, …) so the message stream reads
# like drift's own progress display.
agent_message_chunk: "{{contentText .update.content}}"

user_message_chunk: "[User] {{contentText .update.content}}"

agent_thought_chunk: |-
  {{if contentText .update.content}}
  
  💭 *thinking: {{contentText .update.content}}*{{end}}

tool_call: |-
  {{$content := toolCallContentJoined .update.content}}
  {{if $content}}
  {{toolIcon .update.kind}} running **{{.update.title}}**
  {{$content}}
  {{else if .update.rawInput_DISABLE -}}
  {{switch .update.title -}}
  {{case "shell_exec" -}}
  ```bash
  {{.update.rawInput.command}}
  ```
  {{case "script_exec" -}}
  ```drift
  {{.update.rawInput.source}}
  ```
  {{case "file_grep" -}} **{{.update.rawInput.path}}**: `{{.update.rawInput.pattern}}`
  {{case "file_glob" -}} => `{{.update.rawInput.pattern}}`
  {{case "file_read" -}} **{{.update.rawInput.path}}**: L{{.update.rawInput.start_line}}-{{.update.rawInput.end_line}}
  {{case "file_edit" -}} `{{.update.rawInput.path}}`
  
  ```
  {{diff .update.rawInput.old_string .update.rawInput.new_string}}
  ```
  {{case "file_write" -}} **Writing:** {{.update.rawInput.path}}
  
  ```
  {{.update.rawInput.content}}

  {{prettyJson .update.rawInput}}
  ```
  {{case "web_fetch" -}} **{{.update.rawInput.url}}**
  {{case "directory_list" -}} **{{.update.rawInput.path}}**
  {{case "file_exists" -}} **{{.update.rawInput.path}}**
  {{case "plan"}}
    {{switch .update.rawInput.op -}}
      {{case "add"}} **⚪️** {{.update.rawInput.content}}
      {{case "update" -}}
        {{switch .update.rawInput.status -}}
          {{case "in_progress"}} **🛠️** {{.update.rawInput.id}} {{.update.rawInput.status}}
          {{default}} **🛠️** {{.update.rawInput.id}} {{.update.rawInput.status}}
        {{end -}}
      {{case "close"}} **🟢** **{{.update.rawInput.id}}** {{.update.rawInput.status}}
      {{case "list"}} **🗓️**
      {{default}} **⚪️** {{.update.rawInput.op}} {{.update.rawInput.content}}
    {{end -}}
  {{case "memory_add" }} **{{.update.rawInput.scope}}**

  ```
  {{.update.rawInput.content}}
  ```
  {{case "contexts__execute_tool" -}}
  
  **Executing:** {{.update.rawInput.server}} :: {{.update.rawInput.tool}}
    {{switch .update.rawInput.tool-}}
      {{case "subagentdone"-}}
  **{{.update.rawInput.process_id}}** -> **{{.update.rawInput.status}}**

  {{.update.rawInput.result}}
  
      {{default -}}
  
  ```
  {{prettyJson .update.rawInput.args}}
  ```
    {{end -}}
  {{case "ask_user" -}}
  **Question:** {{.update.rawInput.question}}
  
  **Options:**{{range $i, $e := .update.rawInput.options}}
  
  - {{add $i 1}}. {{$e}}{{end}}
  {{case "schedule_wakeup" -}} **{{.update.rawInput.delay_seconds}}** `{{.update.rawInput.reason}}`

  ```
  {{.update.rawInput.prompt}}
  ```

  {{default-}}
  ```json
  {{prettyJson .update.rawInput}}
  ```
  {{end -}}
  {{end}}

tool_call_update: |-
  {{$content := toolCallContentJoined .update.content -}}
  {{$label := label .update.title .update.toolCallId -}}
  {{switch .update.status}}
  {{case "completed"}}
  
  ✅ {{$label}}
    {{switch .update._meta.toolName -}}
    {{case "shell_exec" -}} **status:** `{{.update.rawOutput.exit_code}}`
      {{if .update.rawOutput.stdout}}

  **stdout:**
  ```
  {{.update.rawOutput.stdout}}
  ```
      {{end -}}
      {{if .update.rawOutput.stderr}}
  
  **stderr:**
  ```
  {{.update.rawOutput.stderr}}
  ```
      {{end -}}
    {{case "script_exec" -}}
      {{if .update.rawOutput.stdout}}
  
  ```drift
  {{.update.rawOutput.stdout}}
  ```
      {{end -}}
      {{if .update.rawOutput.stderr}}
  
  **stderr:**
  ```
  {{.update.rawOutput.stderr}}
  ```
      {{end -}}
    {{case "file_edit" -}}
    {{case "file_write" -}}
    {{case "file_exists" -}} **{{.update.rawOutput.path}}** {{if .update.rawOutput.exists}}✅{{else}}❌{{end}}
    {{case "file_read" -}}
  **{{.update.rawOutput.path}}**: L{{.update.rawOutput.start_line}}-{{.update.rawOutput.end_line}} (total: {{.update.rawOutput.total_lines}} lines)

  ```
  {{.update.rawOutput.content}}
  ```

    {{case "file_grep" -}} **{{.update.rawOutput.path}}** 🔎 `{{.update.rawOutput.pattern}}`

      {{range $i, $e := .update.rawOutput.files -}}
  
  - **{{$e.file}}** **{{$e.count}}** matches:
        {{range $x, $y := $e.matches -}}
    {{add $x 1}}. L{{$y.line_number}}: `{{$y.content}}`
        {{end -}}
      {{end -}}
    {{case "ask_user" -}} **{{.update.rawOutput.answer}}**
  ```
  {{.update.rawOutput.extra}}
  ```
    {{case "plan" -}}**{{.update.rawOutput.item.content}}** **#{{.update.rawOutput.item.id}}** **{{switch $e.status}}{{case "closed"}}✅{{case "in_progress"}}🛠️{{default}}⬜️{{end}}**
    {{case "web_fetch" -}}
  
  {{.update.rawOutput}}

    {{default}}

  ```
  {{.}}
  ```
    {{end -}}

  {{case "failed"}}
  
  ❌ {{$label}}
  {{default}}
  
  ⏳ {{$label}} (in progress)
  {{end}}

plan: |-
  {{if .update.entries}}
  
  **Plan**{{range $i, $e := .update.entries}}
    {{planIcon $e.status}} {{add $i 1}}. {{$e.content}}{{if $e.priority}} ({{$e.priority}}){{end}}{{end}}{{end}}

plan_update: |-
  {{if .update.plan.entries}}
  
  **Plan updated**{{range $i, $e := .update.plan.entries}}
    {{planIcon $e.status}} {{add $i 1}}. {{$e.content}}{{end}}{{end -}}
  {{if .update.plan.content}}
  
  **Plan**
  
  {{.update.plan.content}}{{end -}}
  {{if .update.plan.uri}}
  
  📎 Plan: {{.update.plan.uri}}{{end}}

plan_removed: |-
  {{if .update.id}}
  🗑️ Plan removed ({{.update.id}}){{end}}

available_commands_update: |-
  {{if .update.availableCommands}}
  
  📋 {{len .update.availableCommands}} command(s) available:{{range .update.availableCommands}}
  - `{{.name}}`{{if .description}} — {{.description}}{{end}}{{end}}{{end}}

config_option_update: |-
  {{if .update.configOptions}}
  ⚙️ Config options:{{range .update.configOptions}}
  - `{{.name}}` = {{.currentValue}}{{if .description}} ({{.description}}){{end}}{{end}}{{end}}

session_info_update: |-
  {{if .update.title}}
  🏷️ Session: {{.update.title}}{{end}}{{if .update.updatedAt}}
  🕒 updated {{.update.updatedAt}}{{end}}

usage_update: |-
  
  
  📊 {{metaTokens .update._meta "input"}} in · {{metaTokens .update._meta "output"}} out | cache +{{metaTokens .update._meta "cacheNew"}} new · {{metaTokens .update._meta "cacheRead"}} hit | {{humanTokens .update.used}}/{{humanTokens .update.size}} ctx{{if .update.size}} ({{pct .update.used .update.size}}%){{end}}

current_mode_update: |-
  
  🔀 Mode: **{{.update.currentModeId}}**

permission_request: |-
  
  
  🔐 **Permission requested**{{if .toolCall.title}}: {{toolIcon .toolCall.kind}} {{.toolCall.title}}{{end}}{{if ne .toolCall.title "ask_user"}}{{if .options}}

  {{if .toolCall._meta.toolName -}}
  {{switch .toolCall._meta.toolName -}}
  {{case "shell_exec" -}}
  ```bash
  {{.toolCall.rawInput.command}}
  ```
  {{case "script_exec" -}}
  ```drift
  {{.toolCall.rawInput.source}}
  ```
  {{case "file_grep" -}} **{{.toolCall.rawInput.path}}**: `{{.toolCall.rawInput.pattern}}`
  {{case "file_glob" -}} 🔎 `{{.toolCall.rawInput.pattern}}`
  {{case "file_read" -}} **{{.toolCall.rawInput.path}}**: L{{.toolCall.rawInput.start_line}}-{{.toolCall.rawInput.end_line}}
  {{case "file_exists" -}} **{{.toolCall.rawInput.path}}**
  {{case "file_delete" -}} **🗑️ `{{.toolCall.rawInput.path}}`**
  {{case "file_edit" -}} `{{.toolCall.rawInput.path}}`
  
  ```
  {{diff .toolCall.rawInput.old_string .toolCall.rawInput.new_string}}
  ```
  {{case "file_write" -}} **Writing:** {{.toolCall.rawInput.path}}
  
  ```
  {{.toolCall.rawInput.content}}
  ```
  {{case "directory_list" -}} **{{.toolCall.rawInput.path}}**
  {{case "web_fetch" -}} **{{.toolCall.rawInput.url}}**
  {{case "plan"}}
    {{switch .toolCall.rawInput.op -}}
      {{case "add"}} **⚪️** {{.toolCall.rawInput.content}}
      {{case "update" -}}
        {{switch .toolCall.rawInput.status -}}
          {{case "in_progress"}} **🛠️** {{.toolCall.rawInput.id}} {{.toolCall.rawInput.status}}
          {{default}} **🛠️** {{.toolCall.rawInput.id}} {{.toolCall.rawInput.status}}
        {{end -}}
      {{case "close"}} **🟢** **{{.toolCall.rawInput.id}}** {{.toolCall.rawInput.status}}
      {{case "list"}} **🗓️**
      {{default}} **⚪️** {{.toolCall.rawInput.op}} {{.toolCall.rawInput.content}}
    {{end -}}
  {{case "memory_add" }} **{{.toolCall.rawInput.scope}}**

  ```
  {{.toolCall.rawInput.content}}
  ```
  {{case "contexts__execute_tool" -}}
  
  **Executing:** {{.toolCall.rawInput.server}} :: {{.toolCall.rawInput.tool}}
    {{switch .toolCall.rawInput.tool -}}
      {{case "subagentdone" -}}
  **{{.toolCall.rawInput.process_id}}** -> **{{.toolCall.rawInput.status}}**

  {{.toolCall.rawInput.result}}
  
      {{default -}}
  
  ```
  {{prettyJson .toolCall.rawInput.args}}
  ```
    {{end -}}
  {{case "ask_user"}}
  
  **Options:**{{range $i, $e := .options}}
  
  - {{add $i 1}}. {{$e.name}}({{$e.kind}}) {{end}}
  {{case "schedule_wakeup" -}} **{{.toolCall.rawInput.delay_seconds}}** `{{.toolCall.rawInput.reason}}`

  ```
  {{.toolCall.rawInput.prompt}}
  ```

  {{default-}}
  ```json
  {{prettyJson .toolCall}}
  ```
  {{end -}}
  {{else }}
    
  ```
  {{prettyJson .}}
  ```
  {{end}}
  {{if ne "ask_user" .toolCall._meta.toolName -}}
  
  Options:{{range $i, $o := .options}} **{{add $i 1}}**. {{if $o.name}}{{$o.name}}{{else}}{{$o.optionId}}{{end}}{{end}}
  {{end -}}

# Deliberately no 'unknown' key: AcpRenderEngine's fallback chain
# (extractable text, then a raw JSON dump) only kicks in when a kind is NOT
# a key in this map. Mapping 'unknown' to "" here would silently swallow
# every malformed notification instead of showing the raw-JSON fallback —
# the opposite of the "messages are always displayed" guarantee this
# engine provides.
